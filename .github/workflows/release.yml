name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Membuat/menyegarkan "release PR" (bump versi + CHANGELOG) dari commit Conventional.
      # Saat PR itu di-merge, release-please membuat tag + GitHub Release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Hanya saat sebuah release benar-benar dibuat: build lalu lampirkan zip extension.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm install --no-audit --no-fund

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Lampirkan zip extension ke release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} dist/warga62-autoplay-extension-v*.zip --clobber
