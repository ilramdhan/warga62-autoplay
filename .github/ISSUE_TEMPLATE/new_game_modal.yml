name: Modal game baru
description: Bot macet di modal yang belum dikenali
title: '[Modal] '
labels: ['new-modal']
body:
  - type: markdown
    attributes:
      value: |
        Ikuti langkah di CONTRIBUTING.md, bagian "Melaporkan modal game baru". Hapus data pribadi dari log sebelum mengunggahnya.
  - type: dropdown
    id: runner
    attributes:
      label: Jenis runner
      options:
        - extension
        - runner
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi
      placeholder: 'contoh: 2.0.0'
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - grind
        - arena
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Peran
      options:
        - host
        - guest
    validations:
      required: true
  - type: textarea
    id: modal-text
    attributes:
      label: Teks modal
      description: Salin seluruh teks yang tampil di modal.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Seret lalu lepas gambar ke kolom ini.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Log konsol [W62]
      description: Salin baris yang diawali [W62] dari DevTools, tab Console.
      render: text
    validations:
      required: true
